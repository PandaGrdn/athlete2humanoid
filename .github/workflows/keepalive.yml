# Keeps a free Hugging Face Space awake: it sleeps after 48 h without traffic. Every 12 h it GETs
# $API_BASE/readyz (a sleeping Space wakes on the request). Skipped when the API_BASE variable isn't set;
# needs no secrets. GitHub turns scheduled workflows off after 60 days without repo activity.
# On Cloud Run (the current API) this does not keep it warm: an instance scales to zero about 15 min after
# its last request, so a 12 h ping only proves the service still answers. Warming it all day would need a
# ping every few minutes or --min-instances 1, both outside the free tier (docs/DEPLOY.md).
name: keepalive

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.API_BASE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET /readyz (retries while a sleeping Space wakes up)
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          for i in $(seq 1 16); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API_BASE/readyz" || true)
            echo "attempt $i: $code"
            [ "$code" = 200 ] && exit 0
            sleep 30
          done
          echo "::warning::$API_BASE/readyz not 200 after 8 min"
