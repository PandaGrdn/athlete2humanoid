# Deploys on push to main, each half only when its secrets exist (otherwise the job is skipped, not failed).
#
#   HF Space (backend):         secret HF_TOKEN (write), variable HF_SPACE (e.g. you/athlete2humanoid-api)
#   Cloudflare Pages (frontend): secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; variable API_BASE
#   optional variables:          A2H_CORS (frontend origin(s), default https://athlete2humanoid.pages.dev),
#                                A2H_DEMO_RUN, CF_PAGES_PROJECT (default athlete2humanoid)
#
# The Space deploy uploads code only (server/, the live pipeline's modules, Dockerfile, README): the run data in
# its data/ folder and the live runner's assets/ come from the first `scripts/deploy.sh` (docs/DEPLOY.md), since
# outputs/ and assets/ aren't in git.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      hf: ${{ steps.check.outputs.hf }}
      cf: ${{ steps.check.outputs.cf }}
    steps:
      - id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          hf=false; cf=false
          [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ] && hf=true
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$API_BASE" ] && cf=true
          echo "hf=$hf" >> "$GITHUB_OUTPUT"; echo "cf=$cf" >> "$GITHUB_OUTPUT"
          echo "HF Space deploy: $hf; Cloudflare Pages deploy: $cf" >> "$GITHUB_STEP_SUMMARY"

  space:
    needs: gate
    if: needs.gate.outputs.hf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Build the code-only bundle
        env:
          CORS: ${{ vars.A2H_CORS || 'https://athlete2humanoid.pages.dev' }}
          DEMO_RUN: ${{ vars.A2H_DEMO_RUN }}
        run: python3 scripts/build_space.py --code-only --out build/space --cors "$CORS" ${DEMO_RUN:+--demo-run "$DEMO_RUN"}
      - name: Upload to the Space (keeps its data/ and assets/)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          uvx --from "huggingface_hub==2.2.0" hf upload "$HF_SPACE" build/space . --repo-type space \
            --commit-message "deploy ${GITHUB_SHA::7}"
      - name: Wait for it to come up
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          host="https://$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]_.' '[:lower:]--').hf.space"
          for i in $(seq 1 40); do curl -sf "$host/readyz" && exit 0; sleep 15; done
          echo "::warning::$host/readyz not ready after 10 min (the build may still be running)"

  pages:
    needs: gate
    if: needs.gate.outputs.cf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          API_BASE: ${{ vars.API_BASE }}
      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'athlete2humanoid' }}
        run: npx --yes wrangler@4.149.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
